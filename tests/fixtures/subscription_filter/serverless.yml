# Fixture for the end-to-end test of CKV_CUSTOM_API_GATEWAY_SUBSCRIPTION_FILTER.
# Each SubscriptionFilter's name says what the check should report for it.
service: my-service

provider:
  name: aws
  runtime: nodejs22.x
  stage: prod

functions:
  hello:
    handler: handler.hello

resources:
  Resources:
    HttpApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/http-api/${self:service}-${self:provider.stage}
        RetentionInDays: 30

    RestApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/api-gateway/${self:service}-${self:provider.stage}
        RetentionInDays: 30

    OpenSearchSlowLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/opensearch/${self:service}-${self:provider.stage}/search-slow-logs
        RetentionInDays: 30

    UnnamedLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        RetentionInDays: 30

    # A `!Ref` to an API Gateway log group, correctly configured.
    PassesRefToHttpApiLogGroup:
      Type: AWS::Logs::SubscriptionFilter
      Properties:
        LogGroupName: !Ref HttpApiLogGroup
        FilterName: S3-api-gateway-logs-${self:service}-${self:provider.stage}
        FilterPattern: ''
        DestinationArn: ${cf:YotoInfrastructureKinesis-prod.ApiLogsFirehoseStreamArn}
        RoleArn: !GetAtt CloudWatchLogsToFirehoseRole.Arn
        Distribution: Random

    # A `!Ref` to an API Gateway log group, with the wrong FilterName.
    FailsRefToRestApiLogGroupWithWrongFilterName:
      Type: AWS::Logs::SubscriptionFilter
      Properties:
        LogGroupName: !Ref RestApiLogGroup
        FilterName: wrong-prefix-${self:service}
        FilterPattern: ''
        DestinationArn: ${cf:YotoInfrastructureKinesis-prod.ApiLogsFirehoseStreamArn}
        RoleArn: !GetAtt CloudWatchLogsToFirehoseRole.Arn
        Distribution: Random

    # A literal API Gateway log group name, correctly configured.
    PassesLiteralHttpApiLogGroup:
      Type: AWS::Logs::SubscriptionFilter
      Properties:
        LogGroupName: /aws/http-api/${self:service}-${self:provider.stage}
        FilterName: S3-api-gateway-logs-${self:service}-${self:provider.stage}-literal
        FilterPattern: ''
        DestinationArn: ${cf:YotoInfrastructureKinesis-prod.ApiLogsFirehoseStreamArn}
        RoleArn: !GetAtt CloudWatchLogsToFirehoseRole.Arn
        Distribution: Random

    # A `!Ref` to a non-API Gateway log group (this used to crash the check).
    UnknownRefToOpenSearchLogGroup:
      Type: AWS::Logs::SubscriptionFilter
      Properties:
        LogGroupName: !Ref OpenSearchSlowLogGroup
        FilterPattern: ''
        DestinationArn: arn:aws:lambda:eu-west-2:123456789012:function:datadog-forwarder

    # A `!Ref` to a log group whose name is generated by CloudFormation.
    UnknownRefToUnnamedLogGroup:
      Type: AWS::Logs::SubscriptionFilter
      Properties:
        LogGroupName: !Ref UnnamedLogGroup
        FilterPattern: ''
        DestinationArn: arn:aws:lambda:eu-west-2:123456789012:function:datadog-forwarder
